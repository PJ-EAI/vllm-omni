name: vla-maas

# CPU checks of the VLA MaaS protocol, robot client and gateway. The robot
# client job installs nothing but its own package and the protocol package,
# so a server-side dependency sneaking into the robot side fails here.
on:
  pull_request:
    branches: [maas]
    paths:
      - "packages/**"
      - "apps/vla-maas-gateway/**"
      - "apps/vla-maas-studio/**"
      - "examples/online_serving/vla_maas/**"
      - ".claude/skills/vla-maas/scripts/**"
      - ".github/workflows/vla-maas.yml"
  push:
    branches: [maas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the robot-side packages
        run: python -m pip install "./packages/vla-maas-protocol[test]" "./packages/vla-maas-robot[test]"
      - name: Protocol tests
        working-directory: packages/vla-maas-protocol
        run: python -m pytest -q
      - name: Robot client tests
        working-directory: packages/vla-maas-robot
        run: python -m pytest -q
      - name: No server packages installed
        run: |
          ! python -c "import vllm" 2>/dev/null
          ! python -c "import torch" 2>/dev/null

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gateway and client extras
        run: |
          python -m pip install websockets msgpack msgpack-numpy pyyaml numpy typing_extensions pillow pytest
          python -m pip install --no-deps openpi-client
          python -m pip install ./packages/vla-maas-protocol ./packages/vla-maas-robot
      - name: Gateway tests
        working-directory: apps/vla-maas-gateway
        run: python -m pytest -q
      - name: Studio tests (Robot protocol; the MuJoCo twin tests skip without mujoco)
        working-directory: apps/vla-maas-studio
        run: python -m pytest -q
      - name: CPU smoke (mock backend, gateway, LIBERO mock, robot protocol, mock fleet)
        run: bash .claude/skills/vla-maas/scripts/maas_smoke.sh
